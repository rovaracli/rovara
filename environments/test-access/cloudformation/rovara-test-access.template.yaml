  # Rovara assumes this role for a test run. It must present the external id, and it must tag the session with the run id (8 characters).
  RovaraTestRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by Rovara to run tests in this account. Rovara test access.
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref RovaraTestBoundary
      ManagedPolicyArns:
        - !Ref RovaraTestPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RovaraAssumesWithExternalId
            Effect: Allow
            Principal:
              AWS: !Ref RovaraPrincipal
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Sid: RovaraTagsTheSession
            Effect: Allow
            Principal:
              AWS: !Ref RovaraPrincipal
            Action: sts:TagSession
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - rovara-run
              StringLike:
                aws:RequestTag/rovara-run: "????????"

  # Rovara assumes this role to delete what a test run created. It can read and delete, nothing else.
  RovaraTestCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by Rovara to delete what a test run created. It cannot create or change anything. Rovara test access.
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref RovaraTestBoundary
      ManagedPolicyArns:
        - !Ref RovaraTestCleanupPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RovaraAssumesWithExternalId
            Effect: Allow
            Principal:
              AWS: !Ref RovaraPrincipal
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Sid: RovaraTagsTheSession
            Effect: Allow
            Principal:
              AWS: !Ref RovaraPrincipal
            Action: sts:TagSession
            Condition:
              ForAllValues:StringEquals:
                aws:TagKeys:
                  - rovara-run
              StringLike:
                aws:RequestTag/rovara-run: "????????"

  # Tells Rovara this stack exists, and which roles it made. CloudFormation publishes the request to Rovara's SNS topic (ServiceToken); Rovara checks the one-time
  # token and answers CloudFormation. The role ARN and account id go to Rovara; nothing else leaves your account. No code of Rovara's runs in your account. When Rovara
  # cannot be reached, creating the stack fails after 2 minutes and rolls back (create it again from Rovara). Deleting the stack tells Rovara the account is disconnected;
  # if Rovara cannot be reached that step fails after 2 minutes, and you delete the stack again, choosing to retain RovaraCallback.
  RovaraCallback:
    Type: Custom::RovaraTestAccess
    Properties:
      ServiceToken: !Ref CallbackTopicArn
      ServiceTimeout: "120"
      RoleArn: !GetAtt RovaraTestRole.Arn
      CleanupRoleArn: !GetAtt RovaraTestCleanupRole.Arn
      AccountId: !Ref AWS::AccountId
      Region: !Ref AWS::Region
      ExternalId: !Ref ExternalId
      ConnectToken: !Ref ConnectToken
      TemplateVersion: "1.0.0"
Outputs:
  RoleArn:
    Description: The role Rovara assumes to run tests. If Rovara asks for it, this is the value.
    Value: !GetAtt RovaraTestRole.Arn
  CleanupRoleArn:
    Description: The role Rovara assumes to delete what a test run created.
    Value: !GetAtt RovaraTestCleanupRole.Arn
  ExternalId:
    Description: The external id of this connection.
    Value: !Ref ExternalId
  Region:
    Description: The one Region Rovara may use in this account.
    Value: !Ref AWS::Region
  TemplateVersion:
    Description: The version of this template.
    Value: "1.0.0"
