            "Sid": "AllowTestServices",
            "Effect": "Allow",
            "Action": [
              "dynamodb:*",
              "events:*",
              "iam:*",
              "kinesis:*",
              "lambda:*",
              "logs:*",
              "s3:*",
              "secretsmanager:*",
              "sns:*",
              "sqs:*",
              "ssm:*",
              "states:*",
              "sts:GetCallerIdentity",
              "tag:GetResources",
              "tag:GetTagKeys",
              "tag:GetTagValues"
            ],
            "Resource": "*"
          }
        ]
      }

