        default: External id (proves the request comes from your Rovara connection)
      ConnectToken:
        default: One-time connect token (valid 30 minutes)
      RovaraPrincipal:
        default: The Rovara role allowed to use the test role
      CallbackTopicArn:
        default: Rovara's topic in this Region (the stack reports the role there)
Parameters:
  ExternalId:
    Type: String
    Description: The external id of this connection, made by Rovara. The test role can be assumed only by a caller that presents it.
    AllowedPattern: "^rovara-org_[0-9a-z]{20}-conn_[0-9a-z]{20}$"
    ConstraintDescription: Use the link from Rovara. The external id looks like rovara-org_...-conn_...
  ConnectToken:
    Type: String
    NoEcho: true
    Description: A one-time token that tells Rovara which connection this stack belongs to. It expires 30 minutes after Rovara made the link.
    AllowedPattern: "^[A-Za-z0-9_-]{16,256}$"
    ConstraintDescription: Use the link from Rovara.
  RovaraPrincipal:
    Type: String
    Description: The ARN of the Rovara role that assumes the test role.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$"
    ConstraintDescription: Use the link from Rovara. This is an IAM role ARN.
  CallbackTopicArn:
    Type: String
    Description: Rovara's SNS topic in this stack's Region. The custom resource sends the new role there. It must be in the same Region as the stack.
    AllowedPattern: "^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$"
    ConstraintDescription: Use the link from Rovara. This is an SNS topic ARN in the stack's Region.
