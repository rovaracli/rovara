              "iam:UploadCloudFrontPublicKey",
              "iam:UploadSSHPublicKey",
              "iam:UploadServerCertificate",
              "iam:UploadSigningCertificate"
            ],
            "NotResource": [
              {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/rv-${!aws:PrincipalTag/rovara-run}-*"
              },
              {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/rv-${!aws:PrincipalTag/rovara-run}-*"
              },
              {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/rv-${!aws:PrincipalTag/rovara-run}-*"
              }
            ]
          },
          {
            "Sid": "DenyRoleWithoutBoundary",
            "Effect": "Deny",
            "Action": [
              "iam:CreateRole",
              "iam:PutRolePermissionsBoundary"
            ],
            "Resource": "*",
            "Condition": {
              "StringNotEquals": {
                "iam:PermissionsBoundary": {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/rovara-test-boundary-${ExternalId}"
                }
              }
            }
          },
          {
            "Sid": "DenyBoundaryRemoval",
            "Effect": "Deny",
            "Action": [
              "iam:DeleteRolePermissionsBoundary",
              "iam:DeleteUserPermissionsBoundary",
              "iam:PutUserPermissionsBoundary"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenyLongLivedKeys",
            "Effect": "Deny",
            "Action": [
              "iam:CreateAccessKey",
              "iam:CreateLoginProfile",
              "iam:CreateServiceSpecificCredential",
              "iam:CreateUser",
              "iam:UpdateLoginProfile",
              "iam:UploadSSHPublicKey"
            ],
            "Resource": "*"
          }
        ]
      }

