Description: >-
  Rovara test access, template 1.0.0. Creates the IAM role Rovara assumes to run your tests in this account, a role that can only delete what a test run created,
  and the limits both roles obey (a permissions boundary and policies). Rovara tells you the role was created through the custom resource at the end of this template.
  Read the policies before you create the stack. Rovara never asks for access keys.
