# GENERATED by scripts/test-access/build-artifacts.ts from rovara-test-access.source.yaml and packages/cloud-contracts/src/test-access-policy.ts. Do not edit; change the source and run it again.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Rovara test access, template 1.0.0. Creates the IAM role Rovara assumes to run your tests in this account, a role that can only delete what a test run created,
  and the limits both roles obey (a permissions boundary and policies). Rovara tells you the role was created through the custom resource at the end of this template.
  Read the policies before you create the stack. Rovara never asks for access keys.
Metadata:
  RovaraTemplateVersion: "1.0.0"
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Filled in by Rovara. Leave as they are.
        Parameters:
          - ExternalId
          - ConnectToken
          - RovaraPrincipal
          - CallbackTopicArn
    ParameterLabels:
      ExternalId:
        default: External id (proves the request comes from your Rovara connection)
      ConnectToken:
        default: One-time connect token (valid 30 minutes)
      RovaraPrincipal:
        default: The Rovara role allowed to use the test role
      CallbackTopicArn:
        default: Rovara's topic in this Region (the stack reports the role there)
Parameters:
  ExternalId:
    Type: String
    Description: The external id of this connection, made by Rovara. The test role can be assumed only by a caller that presents it.
    AllowedPattern: "^rovara-org_[0-9a-z]{20}-conn_[0-9a-z]{20}$"
    ConstraintDescription: Use the link from Rovara. The external id looks like rovara-org_...-conn_...
  ConnectToken:
    Type: String
    NoEcho: true
    Description: A one-time token that tells Rovara which connection this stack belongs to. It expires 30 minutes after Rovara made the link.
    AllowedPattern: "^[A-Za-z0-9_-]{16,256}$"
    ConstraintDescription: Use the link from Rovara.
  RovaraPrincipal:
    Type: String
    Description: The ARN of the Rovara role that assumes the test role.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$"
    ConstraintDescription: Use the link from Rovara. This is an IAM role ARN.
  CallbackTopicArn:
    Type: String
    Description: Rovara's SNS topic in this stack's Region. The custom resource sends the new role there. It must be in the same Region as the stack.
    AllowedPattern: "^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$"
    ConstraintDescription: Use the link from Rovara. This is an SNS topic ARN in the stack's Region.
Resources:
  # The ceiling. The test role, the cleanup role and every role a test run creates carry it. It allows the services below and nothing else, requires the run tag,
  # keeps to this Region, and cannot be taken off. The per-action checks are in the RovaraTestGuard policies.
  RovaraTestBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "rovara-test-boundary-${ExternalId}"
      Description: Limits Rovara's test role and every role a test run creates. Rovara test access.
      PolicyDocument: {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "AllowTestServices",
            "Effect": "Allow",
            "Action": [
              "apigateway:*",
              "dynamodb:*",
              "events:*",
              "iam:*",
              "kinesis:*",
              "kms:*",
              "lambda:*",
              "logs:*",
              "s3:*",
              "secretsmanager:*",
              "sns:*",
              "sqs:*",
              "ssm:*",
              "states:*",
              "sts:GetCallerIdentity",
              "tag:GetResources",
              "tag:GetTagKeys",
              "tag:GetTagValues"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenyWithoutRunTag",
            "Effect": "Deny",
            "NotAction": [
              "sts:GetCallerIdentity"
            ],
            "Resource": "*",
            "Condition": {
              "Null": {
                "aws:PrincipalTag/rovara-run": "true"
              }
            }
          },
          {
            "Sid": "DenyOtherRegions",
            "Effect": "Deny",
            "NotAction": [
              "iam:*",
              "s3:GetBucketLocation",
              "s3:ListAllMyBuckets",
              "sts:GetCallerIdentity"
            ],
            "Resource": "*",
            "Condition": {
              "StringNotEquals": {
                "aws:RequestedRegion": {
                  "Fn::Sub": "${AWS::Region}"
                }
              }
            }
          },
          {
            "Sid": "DenyRunTagChange",
            "Effect": "Deny",
            "Action": [
              "*"
            ],
            "Resource": "*",
            "Condition": {
              "ForAnyValue:StringEquals": {
                "aws:TagKeys": "rovara-run"
              },
              "StringNotEquals": {
                "aws:RequestTag/rovara-run": "${aws:PrincipalTag/rovara-run}"
              }
            }
          },
          {
            "Sid": "DenyIamOutsideRunNames",
            "Effect": "Deny",
            "Action": [
              "iam:AcceptDelegationRequest",
