name: CI

# Rovara Cloud. On the private PrepLabsAI/Rovara-cloud this is MANUAL RUNS ONLY (owner decision 2026-10-27, to protect the Actions budget; the workflow is
# disabled there). The gate for Cloud pull requests and cloud/next is the PUBLIC CI-only copy rovaracli/rovara (free runners; DEC 33/33a, DEC 235a): there every push
# to cloud/next or to a `cloud-pr/<n>` branch runs the whole suite in 8 test shards plus typecheck:all, lint and build:web (scripts: ~/.local/share/rovara-tools/cloud-ci.sh <pr>).
# Cloud is the API layer (packages/cloud-server and the web app over Rovara Code's API) plus its one
# stack and release pipeline (infra/), so CI checks only those: the type checks, lint, the test shards,
# a reproducible web build, the browser tests against the pretend Code, and the CDK synth.
on:
  workflow_dispatch:
  # Only rovaracli/rovara acts on a push: the `if` of `scope` and `local` below skips every other repository, so a push to Rovara-cloud starts no job.
  push:
    branches:
      - cloud/next
      - cloud-pr/**

# Read-only.
permissions:
  contents: read

# The pinned gitleaks the secret-scan gate's real tests need: the same version as the release pipeline (infra/lib/cloud-release-actions.ts), and the sha256 gitleaks publishes for the linux x64
# archive (gitleaks_8.30.1_checksums.txt; its arm64 line equals the pipeline's pinned hash). A new version needs a new hash here and there. Downloaded once per run by the `gitleaks` job.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

# A newer run on the same ref supersedes the one in progress (owner decision "CI cost", 2026-11-02): a second manual run of a branch, or a new push to a pull
# request, cancels the first one's remaining jobs, so no runner minutes are spent on a commit nobody is waiting for. This includes a manual run: dispatch a
# branch again only when you mean to replace the run in progress. A run of cloud/next itself is never cancelled by a later push: each merge keeps its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/cloud/next' }}

# Cheap checks first, expensive jobs second. `scope` decides whether anything needs to run. `checks` (the type check, which also builds the packages, and the stricter type check; a few minutes
# on its own) must pass before the test shards and the release check start, so a type error stops the run
# before any of those spend a minute. The full-repository lint takes 16 minutes on Cloud's runners; if it gated the shards they would start 16 minutes later, so `lint` waits
# for `checks` and then runs beside the shards instead (a lint failure still fails the run, and the shards already running finish). The job called `local` waits for all of
# them and is the one check a pull request needs (scripts/ci-gate.ts).
jobs:
  # A pull request that changes only Markdown under specs/ or docs/, which no test reads, skips the
  # jobs below (scripts/ci-docs-only.ts). Manual runs always run them. A draft skips every job,
  # `local` included, so it shows no failed check.
  scope:
    if: >-
      github.event.pull_request.draft != true && (
      (github.repository != 'PrepLabsAI/Rovara-cloud' && (github.event_name != 'push' || github.repository == 'rovaracli/rovara'))
      || (github.repository == 'PrepLabsAI/Rovara-cloud' && (github.event_name != 'pull_request' || github.base_ref == 'cloud/integration' || startsWith(github.base_ref, 'release/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      # Depth 2 keeps the pull request's merge commit and its first parent, the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Docs-only change?
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          node scripts/ci-docs-only.ts "$RUNNER_TEMP/changed.txt"
      - name: Markdown-only change
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Only Markdown that no test reads changed; typecheck, the stricter type check, lint and tests are skipped."

  # Downloads the pinned gitleaks archive ONCE per run and checks it against the sha256 above; the eight test shards restore it from the cache (and each checks the hash again, so a bad cache
  # entry can never be used; a shard that finds no archive downloads it itself and says so). Without gitleaks the secret-scan gate's real tests FAIL in CI (tests/support/gitleaks-required.ts).
  gitleaks:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cached gitleaks archive
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/gitleaks.tar.gz
          key: gitleaks-linux-x64-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Download gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          if [ -f "$archive" ] && echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -; then exit 0; fi
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -

  # The gate for every expensive job below: the type check (tsc -b) and the stricter type check. Nothing in it needs more than the TypeScript compiler.
  checks:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Cloud runs on private 2 vCPU / 8 GB runners, about 1.6x slower than the public 4 vCPU ones. Without the lint (its own job below) this took about 11 minutes there.
    timeout-minutes: ${{ (github.repository == 'PrepLabsAI/Rovara-cloud' || github.repository_owner == 'rovaracli') && 30 || 15 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        env:
          # tsc -b needs more than the default ~2 GB heap; per step, so test workers keep the default.
          NODE_OPTIONS: --max-old-space-size=6144
      # The stricter type check (the programs in tsconfig.lint/, which also cover tests/ and scripts/)
      # may not add errors beyond tests/typecheck-baseline.json (issue #50, scripts/typecheck-baseline.ts).
      # On the public repository a pull request runs only the programs its changed files can affect
      # (TYPECHECK-SPLIT.md); depth 2 puts the base branch at HEAD^1, as in the scope job. A manual run runs
      # all. On Cloud every run, pull request or not, checks every program.
      - name: Stricter type check (programs the change affects)
        if: github.repository != 'PrepLabsAI/Rovara-cloud' && github.event_name == 'pull_request'
        run: npm run typecheck:changed -- --base HEAD^1
      - name: Stricter type check (every program)
        if: github.repository == 'PrepLabsAI/Rovara-cloud' || github.event_name != 'pull_request'
        run: npm run typecheck:all
        env:
          # tsc -b needs more than the default ~2 GB heap; per step, so test workers keep the default.
          NODE_OPTIONS: --max-old-space-size=6144

  # The full-repository lint, on every run on both repositories, with the same config and rules as `eslint .`. It starts once `checks` has passed (no lint minutes are spent on code that
  # does not type-check) and runs beside the test shards, not before them: it took 16 of the old checks job's 27 minutes on 2026-10-31 and passed 30 once v1.2 landed, and the private
  # repo's runners get 45. It builds the packages itself (`npm run typecheck`) because the lint programs read the declarations that `tsc -b` leaves behind, and a job cannot read another's disk.
  # One eslint process over the whole repository needed about 14 GB (13.8 GB measured) and ran out of memory on the 8 GB runner (C90), so scripts/lint-shards.ts lints one TypeScript
  # program of tsconfig.lint/ at a time (the programs the stricter type check uses), then the web directories, then everything else, each in its own
  # process. Each process has a 4 GB heap cap; the largest measured peak is about 3.6 GB.
  lint:
    needs: [scope, checks]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.repository == 'PrepLabsAI/Rovara-cloud' || github.repository_owner == 'rovaracli') && 45 || 15 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        env:
          # tsc -b needs more than the default ~2 GB heap; per step, so test workers keep the default.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run lint

  # Each shard gets a share of the test files balanced by run time, not by file count (vitest's own --shard hands out an even number of files, and the slow CDK and container
  # files made some shards take twice as long as others). tests/support/duration-sequencer.ts, set in vitest.config.ts, splits the files by the recorded seconds in
  # tests/.timings/vitest-durations.json; a file with no recorded time gets the median. Regenerate the timings (scripts/test-shard-timings.ts) after many files are added. To change
  # the count, change the list: the shard total below comes from it. Four shards took 49 to 61 minutes each on the private repo's 2 vCPU runners (run 41332313193: one hit
  # the 60-minute limit), so there were six; on the public copy's free runners there are eight (DEC 235a), the gate for Cloud pull requests: the same total runner minutes, less waiting. They wait for `checks`, so a type error stops them before they start.
  test:
    needs: [scope, checks, gitleaks]
    if: needs.scope.outputs.docs_only != 'true'
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.repository == 'PrepLabsAI/Rovara-cloud' || github.repository_owner == 'rovaracli') && 60 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # The test shards write a lot under /tmp (CDK assemblies, fixtures), and the stock runner image already holds several GB of toolchains the job never uses. Dropping
      # them first keeps a shard from running out of disk (EDQUOT, errno -122, on a copyfile in run 40693750224). tests/support/test-file-temp-dir.ts removes the CDK assemblies a file leaves.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The secret-scan gate's tests run the real gitleaks (tests/contract/pipeline-gitleaks-bypass.test.ts) and FAIL in CI when it is missing (tests/support/gitleaks-required.ts).
      # The `gitleaks` job downloaded the archive once; it is restored from the cache and checked against the pinned sha256 again before it is unpacked.
      - name: Restore gitleaks archive
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/gitleaks.tar.gz
          key: gitleaks-linux-x64-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          if ! { [ -f "$archive" ] && echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -; }; then
            echo "::warning::the gitleaks archive was not in this run's cache; downloading it in this job"
            curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          fi
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The packages import each other through their built output, which `npm run typecheck` used to leave behind.
      - run: npm run build
        env:
          # tsc -b needs more than the default ~2 GB heap; per step, so test workers keep the default.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The web app builds the same twice, and Cloud's stack and its release pipeline synthesize (infra/lib/app.ts).
  release:
    needs: [scope, checks]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.repository == 'PrepLabsAI/Rovara-cloud' || github.repository_owner == 'rovaracli') && 25 || 15 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # tsc -b needs more than the default ~2 GB heap; per step, so test workers keep the default.
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run build:web
      - run: npm run infra:synth
      - name: Web builds are reproducible
        run: |
          cp -R packages/web/dist "$RUNNER_TEMP/web-first"
          npm run build:web
          diff -r "$RUNNER_TEMP/web-first" packages/web/dist

  # Browser tests (Playwright, chromium only for now): the web app in a real browser against the pretend Rovara Code (npm run fake-code, tests/support/fake-code.ts), both started by
  # tests/web/browser/playwright.config.ts. Smoke specs for sign-in, Home, starting a task, the task page and the "not available yet" state of screens Code does not serve yet.
  # Locally: `npm run build && npm run test:browser`. Like every job here it runs from a manual dispatch only (migration plan v3.2 row CI; owner decision 2026-11-14 restored browser tests in
  # Cloud's lane CI as ordinary work). The browser itself is cached by the Playwright version package-lock.json pins.
  browser:
    needs: [scope, checks]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.repository == 'PrepLabsAI/Rovara-cloud' || github.repository_owner == 'rovaracli') && 30 || 15 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The packages and the built web app (packages/web/dist/app) that Cloud's server serves.
      - run: npm run build
        env:
          # tsc -b needs more than the default ~2 GB heap; per step, so test workers keep the default.
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Playwright version
        id: playwright-version
        # A version that cannot be read stops the job here: a constant key would serve one Playwright's browser to another.
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright-core']?.version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::Could not read the Playwright version from package-lock.json (packages['node_modules/playwright-core'].version); the browser cache key needs it."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright chromium and system packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser
      # A failed run leaves the Playwright traces (kept on failure) and the HTML report, to open with `npx playwright show-trace` or `show-report`.
      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-playwright
          path: |
            .test-build/browser/results
            .test-build/browser/report
          if-no-files-found: ignore
          retention-days: 7

  # The one check a pull request needs. It runs even when a job before it failed or was cancelled.
  local:
    needs: [scope, checks, gitleaks, lint, test, release, browser]
    if: >-
      always() && github.event.pull_request.draft != true && (
      (github.repository != 'PrepLabsAI/Rovara-cloud' && (github.event_name != 'push' || github.repository == 'rovaracli/rovara'))
      || (github.repository == 'PrepLabsAI/Rovara-cloud' && (github.event_name != 'pull_request' || github.base_ref == 'cloud/integration' || startsWith(github.base_ref, 'release/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Every job passed?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.ts
