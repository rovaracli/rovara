name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

# A second tag push (or a re-run) must never race a release already publishing: cancelling a
# half-published release would leave images, the GitHub release and npm inconsistent with each
# other. Keyed by ref, not workflow, so only the same tag's own runs share the group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Public repository only: never on the private PrepLabsAI/Rovara-cloud.
    if: github.repository == 'PrepLabsAI/Rovara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm run typecheck:all && npm run lint && npm run build && npm test && npm run infra:synth

  images:
    needs: test
    if: github.repository == 'PrepLabsAI/Rovara' && (vars.AGENTX_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, id-token: write }
    outputs:
      worker: ${{ steps.push.outputs.worker }}
      slack: ${{ steps.push.outputs.slack }}
      executor: ${{ steps.push.outputs.executor }}
      embedder: ${{ steps.push.outputs.embedder }}
    steps:
      # AGENTX_PUBLISH_ROLE_ARN's trust policy only allows this repository's v* tags (by immutable ID),
      # so a workflow_dispatch run must be re-run from the tag ref itself; fail clearly here instead
      # of letting configure-aws-credentials fail later with an opaque AssumeRoleWithWebIdentity
      # error. GITHUB_REF/GITHUB_REF_NAME are the runner's own default environment variables, read
      # directly rather than interpolated in as `${{ github.ref }}`, so the version this job (and
      # every job below it) uses comes from one source of truth: the tag, never a workflow_dispatch
      # input.
      - name: Require a version tag ref
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::release.yml publishing jobs must run from a version tag (refs/tags/v*), not $GITHUB_REF. Re-run workflow_dispatch from the tag." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release.yml requires a tag name of the form vX.Y.Z, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # A version tag on a commit that never reached mainline (a feature branch, an unmerged PR)
      # would otherwise publish unreviewed code, and npm never takes a version number back. The
      # compare API answers "identical" or "behind" exactly when the tagged commit is mainline's
      # tip or one of its ancestors. This catches mistakes only: the workflow that runs is the
      # tagged commit's own copy, so someone who can push tags could remove this step; the v* tag
      # ruleset in docs/releases.md is what restricts who can tag.
      - name: Require the tagged commit to be on mainline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/mainline...$GITHUB_SHA" --jq .status); then
            echo "::error::could not compare $GITHUB_REF_NAME ($GITHUB_SHA) with mainline" >&2
            exit 1
          fi
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on mainline (compare status: $status). Tag a commit on mainline." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      # The executor image is smoke-tested before it is pushed (scripts/executor-smoke.ts, the definition CI and test-deploy use), which needs the repository's
      # dependencies and build. They run here, before any AWS credential exists in the environment, and only when the executor is published.
      - if: vars.AGENTX_PUBLISH_EXECUTOR_IMAGE == 'true'
        uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - if: vars.AGENTX_PUBLISH_EXECUTOR_IMAGE == 'true'
        run: npm ci && npm run build
      # Chromium's own sandbox needs unprivileged user namespaces, which Ubuntu 24.04 blocks for AppArmor-confined containers on the runner (the same CI-only
      # step as the linux-runtime job in ci.yml); production hosts (Amazon Linux 2023) have no such restriction.
      - if: vars.AGENTX_PUBLISH_EXECUTOR_IMAGE == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "no AppArmor userns restriction on this kernel"
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AGENTX_PUBLISH_ROLE_ARN }}", aws-region: us-east-1 }
      - uses: aws-actions/amazon-ecr-login@v2
        with: { registry-type: public }
      - uses: docker/setup-buildx-action@v3
      - id: push
        # Without an explicit shell, GitHub Actions runs a Linux run: step's script as plain
        # `bash -e {0}`, not `bash --noprofile --norc -eo pipefail {0}`: a failing
        # `docker buildx imagetools inspect` piped into `tr -d '"'` would be swallowed by the pipe
        # and this step would carry on with an empty (or stale) registry_digest instead of failing.
        # `shell: bash` is what turns pipefail on.
        shell: bash
        env:
          ALIAS: ${{ vars.AGENTX_ECR_PUBLIC_ALIAS }}
          VERSION: ${{ github.ref_name }}
          # The executor image needs its own ECR Public repository and publish-role access (docs/releases.md); off until an owner sets this to true.
          PUBLISH_EXECUTOR: ${{ vars.AGENTX_PUBLISH_EXECUTOR_IMAGE }}
          # The self-hosted embedder image (environments/embedder; the Team record needs it) also needs its own ECR Public repository (agentx-embedder) and publish-role access (docs/releases.md).
          PUBLISH_EMBEDDER: ${{ vars.AGENTX_PUBLISH_EMBEDDER_IMAGE }}
        run: |
          VERSION="${VERSION#v}"
          # The executor goes first: its smoke test can fail, and a pushed tag is immutable, so a failure must stop the job before the worker or slack image is pushed.
          images="worker slack"
          if [ "$PUBLISH_EXECUTOR" = "true" ]; then images="executor $images"; fi
          # The embedder builds with its own quality gates (parity with the original weights, offline smoke test) inside the build, and is pushed only if they pass: it goes first too.
          if [ "$PUBLISH_EMBEDDER" = "true" ]; then images="embedder $images"; fi
          for image in $images; do
            dockerfile=environments/base/Dockerfile
            [ "$image" = slack ] && dockerfile=environments/slack/Dockerfile
            [ "$image" = executor ] && dockerfile=environments/e2e-executor/Dockerfile
            repo="public.ecr.aws/$ALIAS/agentx-$image"
            # --provenance=false --sbom=false: without them, buildx pushes an OCI image *index*
            # (the tagged manifest plus attached provenance/SBOM attestations) instead of a single
            # linux/arm64 image manifest, and the digest this job would read back is the index's,
            # not the image's — the wrong thing to pin the release to.
            if [ "$image" = embedder ]; then
              # linux/arm64, from tracked files only (tests/contract/embedder-image-sources.test.ts); the build script is the same one used by hand (environments/embedder/tools/build-image.sh).
              environments/embedder/tools/build-image.sh "$repo:$VERSION" --push "$RUNNER_TEMP/$image.json"
              digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$image.json")
            elif [ "$image" = executor ]; then
              # The executor is built into the local Docker, smoke-tested as the host runs it (Chromium's sandbox on), and that same loaded image is pushed, so the
              # published bytes are the smoke-tested bytes. A failing smoke test stops the job before anything is pushed.
              docker buildx build --platform linux/arm64 --provenance=false --sbom=false --file "$dockerfile" --tag "$repo:$VERSION" --load .
              npx tsx scripts/executor-smoke.ts "$repo:$VERSION"
              digest=$(docker push "$repo:$VERSION" | tee /dev/stderr | sed -n 's/^.*digest: \(sha256:[a-f0-9]\{64\}\).*$/\1/p' | tail -1)
              if [ -z "$digest" ]; then
                echo "::error::docker push of $repo:$VERSION reported no digest" >&2
                exit 1
              fi
            else
              docker buildx build --platform linux/arm64 --provenance=false --sbom=false --file "$dockerfile" --tag "$repo:$VERSION" --push --metadata-file "$RUNNER_TEMP/$image.json" .
              digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$image.json")
            fi
            # Don't trust the local build metadata alone: read back what the registry actually
            # holds for this tag, and fail loudly if it's missing or doesn't match what was just
            # pushed, rather than shipping a release pinned to a digest nobody can pull.
            registry_digest=$(docker buildx imagetools inspect "$repo:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ -z "$registry_digest" ] || [ "$registry_digest" = "null" ]; then
              echo "::error::registry returned no digest for $repo:$VERSION after push" >&2
              exit 1
            fi
            if [ "$registry_digest" != "$digest" ]; then
              echo "::error::registry digest $registry_digest for $repo:$VERSION does not match the pushed digest $digest" >&2
              exit 1
            fi
            echo "$image=$repo@$registry_digest" >> "$GITHUB_OUTPUT"
          done

  release:
    needs: images
    if: github.repository == 'PrepLabsAI/Rovara' && (vars.AGENTX_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      # release:build imports workspace packages (e.g. @agentx/contracts) by their built dist/
      # output, which is gitignored: without this, a fresh checkout fails with
      # ERR_MODULE_NOT_FOUND before release:build even starts.
      - run: npm run build
      # release:build reads the worker image's catalog-flavor label (scripts/release/image-flavor.ts) with skopeo and refuses any image not labelled release. The images are public ECR
      # (public.ecr.aws, anonymous pull), so no registry login is needed here, as in the bundle job below, which installs skopeo the same way.
      - run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - env:
          VERSION: ${{ github.ref_name }}
          WORKER: ${{ needs.images.outputs.worker }}
          SLACK: ${{ needs.images.outputs.slack }}
          EXECUTOR: ${{ needs.images.outputs.executor }}
          EMBEDDER: ${{ needs.images.outputs.embedder }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          executor_flag=()
          if [ -n "$EXECUTOR" ]; then executor_flag=(--executor-image "$EXECUTOR"); fi
          if [ -n "$EMBEDDER" ]; then executor_flag+=(--embedder-image "$EMBEDDER"); fi
          npm run release:build -- --version "$VERSION" --out "$RUNNER_TEMP/release" --worker-image "$WORKER" --slack-image "$SLACK" "${executor_flag[@]}"
          npm run release:verify -- "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && tar -czf "$RUNNER_TEMP/agentx-$VERSION.tar.gz" .)
          gh release create "v$VERSION" --verify-tag --title "Rovara $VERSION" --notes-from-tag "$RUNNER_TEMP/agentx-$VERSION.tar.gz" "$RUNNER_TEMP/release/release.json"

  npm:
    needs: release
    if: github.repository == 'PrepLabsAI/Rovara' && (vars.AGENTX_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      # release:pack-cli bundles packages/cli, which resolves @agentx/contracts through its built
      # dist/ output (gitignored): without this, a fresh checkout fails with ERR_MODULE_NOT_FOUND.
      - run: npm run build
      # Trusted publishing (OIDC, no stored token) needs a newer npm than Node 22 ships.
      - run: npm install -g npm@11
      - env:
          VERSION: ${{ github.ref_name }}
          NAME: ${{ vars.AGENTX_NPM_PACKAGE || '@preplabsai/rovara-code' }}
        run: |
          VERSION="${VERSION#v}"
          npm run release:pack-cli -- --version "$VERSION" --name "$NAME" --out "$RUNNER_TEMP/cli"
          # A hand-published first version (see docs/releases.md's one-time owner setup) means the
          # very first automated run would otherwise hit this same version already on the registry
          # and fail; npm refuses to publish over an existing version. Check first and skip cleanly
          # instead of failing the job.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; skipping npm publish"
            exit 0
          fi
          # No provenance flag needed: npm trusted publishing adds provenance automatically for
          # this public repository.
          npm publish "$RUNNER_TEMP"/cli/*.tgz --access public

  # The Launch in AWS button's installer: its quick-create template and the setup page's code, in
  # the public installer bucket (docs/releases.md, one-time owner setup). After npm, so latest/
  # never points at a CLI that is not published yet; the versioned files before latest/, which
  # points at them.
  installer:
    needs: npm
    if: github.repository == 'PrepLabsAI/Rovara' && (vars.AGENTX_PUBLISH_ENABLED == 'true' && vars.AGENTX_INSTALLER_BUCKET != '')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      # release:installer imports workspace packages by their built (gitignored) dist/ output.
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AGENTX_PUBLISH_ROLE_ARN }}", aws-region: us-east-1 }
      - env:
          VERSION: ${{ github.ref_name }}
          BUCKET: ${{ vars.AGENTX_INSTALLER_BUCKET }}
        run: |
          VERSION="${VERSION#v}"
          npm run release:installer -- --version "$VERSION" --bucket "$BUCKET" --out "$RUNNER_TEMP/installer"
          aws s3 cp --recursive "$RUNNER_TEMP/installer/$VERSION" "s3://$BUCKET/$VERSION"
          aws s3 cp "$RUNNER_TEMP/installer/latest/installer.template.json" "s3://$BUCKET/latest/installer.template.json" --cache-control "max-age=300"

  # The signed Enterprise bundle, in two jobs. Both are off until the owner sets AGENTX_BUNDLE_ENABLED and AGENTX_BUNDLE_KMS_KEY (no signing key exists yet, register EW2-2).
  #
  # `bundle` builds and checks everything and holds NO AWS credential and no id-token: the synthesis kit is made from a clean checkout of the release's commit (its self-checks, all run inside a
  # sandbox: determinism, the release's own templates, every Enterprise profile against a build from source), and `release:bundle --unsigned` takes only a kit made from the same release.json. It
  # leaves the unsigned folder as an artifact. That artifact is DATA: the sign job never runs a file from it.
  #
  # `sign` is the ONLY job in the bundle path with id-token: write, and the only one that runs in the release-signing GitHub environment (required reviewers, version tags only), which the signing
  # role's trust policy requires: the images and npm jobs also hold id-token, but their tokens do not carry that environment. Its program comes from the tagged commit, never from the bundle job:
  # it checks out only scripts/release and packages/contracts/src, installs ONLY scripts/release/signer (the KMS client, zod and the bundler; its own lockfile; `npm ci --ignore-scripts`, so no
  # dependency's install script runs), builds sign-bundle.ts from the checked-out source, and only then takes the AWS credentials. The program checks every file of the downloaded folder against
  # bundle.json again (and the kit against kit.json) and signs. docs/enterprise/bundle-signing.md. Actions here are pinned to commit SHAs.
  bundle:
    needs: [images, release]
    if: github.repository == 'PrepLabsAI/Rovara' && (vars.AGENTX_PUBLISH_ENABLED == 'true' && vars.AGENTX_BUNDLE_ENABLED == 'true' && vars.AGENTX_BUNDLE_KMS_KEY != '')
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run build
      # The kit step reads the web app when it builds the web function's code package, as the release build does.
      - run: npm run build:web
      # The kit's self-checks run it in bubblewrap (no network); Ubuntu 24.04 restricts unprivileged user namespaces unless this is switched off.
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap skopeo
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          VERSION: ${{ github.ref_name }}
          WORKER: ${{ needs.images.outputs.worker }}
          SLACK: ${{ needs.images.outputs.slack }}
          EXECUTOR: ${{ needs.images.outputs.executor }}
          EMBEDDER: ${{ needs.images.outputs.embedder }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" --pattern "agentx-$VERSION.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/agentx-$VERSION.tar.gz" -C "$RUNNER_TEMP/release"
          npm run release:verify -- "$RUNNER_TEMP/release"
          npm run release:kit -- --release "$RUNNER_TEMP/release" --out "$RUNNER_TEMP/kit"
          LITELLM=$(npx tsx -e 'import { LITELLM_SOURCE_IMAGE } from "./infra/lib/bundle-images.ts"; console.log(LITELLM_SOURCE_IMAGE)')
          image_flags=(--image "litellm=$LITELLM" --image "worker=$WORKER" --image "slack=$SLACK")
          if [ -n "$EXECUTOR" ]; then image_flags+=(--image "executor=$EXECUTOR"); fi
          if [ -n "$EMBEDDER" ]; then image_flags+=(--image "embedder=$EMBEDDER"); fi
          npm run release:bundle -- --release "$RUNNER_TEMP/release" --out "$RUNNER_TEMP/bundle" --unsigned "${image_flags[@]}" --synth-kit "$RUNNER_TEMP/kit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-unsigned
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    needs: bundle
    if: github.repository == 'PrepLabsAI/Rovara' && (vars.AGENTX_PUBLISH_ENABLED == 'true' && vars.AGENTX_BUNDLE_ENABLED == 'true' && vars.AGENTX_BUNDLE_KMS_KEY != '')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions: { contents: read, id-token: write }
    steps:
      # The signer's source, from the tagged commit: only what it is built from.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            packages/contracts/src
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version }
      # Its own package and lockfile: the KMS client, zod and esbuild, nothing else, and no install script runs.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/release/signer
      - run: node scripts/release/signer/node_modules/esbuild/bin/esbuild scripts/release/sign-bundle.ts --bundle --platform=node --format=esm --target=node22 --alias:@agentx/contracts=./packages/contracts/src/index.ts --external:zod --external:@aws-sdk/client-kms --external:typescript --external:@rovara/audit-verifier --external:@aws-crypto/sha256-js --outfile=scripts/release/signer/dist/sign-bundle.mjs
      # Data only: the folder the bundle job made. Nothing in it is run.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: bundle-unsigned, path: "${{ runner.temp }}/bundle" }
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with: { role-to-assume: "${{ vars.AGENTX_BUNDLE_SIGNING_ROLE_ARN }}", aws-region: us-east-1 }
      - env:
          KMS_KEY: ${{ vars.AGENTX_BUNDLE_KMS_KEY }}
        run: node scripts/release/signer/dist/sign-bundle.mjs --bundle "$RUNNER_TEMP/bundle" --kms-key "$KMS_KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-signed
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
